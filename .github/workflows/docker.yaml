name: Docker build

'on':
    schedule:
      - cron: '30 5 * * 1'  # Every Monday at 5:30
    pull_request:
    push:
        branches:
          - master
          - develop
          - feature/**

env:
    UBSAN_OPTIONS: print_stacktrace=1

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
            with:
                submodules: true

          - name: Install Python dependencies
            run: |
                python3 -m pip install --break-system-packages -r requirements.txt 2>/dev/null || \
                    python3 -m pip install -r requirements.txt

          - name: Setup non-root user
            run: |
                if [ "$(id -u)" = "0" ]; then
                    id -u runner 2>/dev/null || useradd -m runner
                    chown -R runner "$GITHUB_WORKSPACE"
                    echo "RUN_AS=sudo -u runner" >> "$GITHUB_ENV"
                fi

          - name: Cmake
            run: ${RUN_AS} make cmake-debug

          - name: Build
            run: ${RUN_AS} make build-debug

          - name: Test
            run: ${RUN_AS} make test-debug